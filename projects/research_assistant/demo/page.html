<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="岗位需求 RAG 分析助手的本地案例回放：查看问题、处理结果、来源和失败边界。">
<title>岗位需求 RAG 分析助手 · 案例回放</title>
<style>
:root{color-scheme:light;--ink:#162742;--muted:#52627b;--blue:#1c51bb;--line:#d9e2ef;--paper:#fff;--bg:#f3f6fb;--soft:#eaf0fc;--green:#08744f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,a,summary{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:var(--blue);text-underline-offset:3px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #f2aa24;outline-offset:4px}header{background:var(--ink);color:white;padding:25px max(24px,calc((100vw - 1240px)/2));display:flex;justify-content:space-between;gap:24px;align-items:center}header h1{font-size:22px;line-height:1.4;margin:0 0 4px;font-weight:650}header p{font-size:14px;color:#c1cfe5;margin:0}.status{font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:9px}.status:before{content:"";width:8px;height:8px;background:#72d6b4;border-radius:50%}.layout{max-width:1240px;margin:30px auto;padding:0 24px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:30px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 14px}.case-list{display:grid;gap:10px}.case-button{width:100%;text-align:left;background:transparent;color:var(--ink);padding:17px 16px;border:1px solid transparent;border-left:3px solid transparent;border-radius:4px;display:grid;grid-template-columns:27px 1fr;gap:10px;line-height:1.5}.case-button:hover{background:#e8eef8}.case-button[aria-pressed="true"]{background:var(--paper);border-color:var(--line);border-left-color:var(--blue);box-shadow:0 4px 18px #18356206}.case-number{color:var(--muted);font-size:13px;padding-top:2px}.case-title{font-size:16px;font-weight:650}.case-kind{display:block;font-size:13px;color:var(--muted);margin-top:4px}.side-note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.side-note strong{color:var(--ink);font-weight:600}.case-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.case-head h2{font-size:28px;line-height:1.35;margin:4px 0 6px;letter-spacing:-.03em}.case-head p{margin:0;color:var(--muted);font-size:15px}.tag{font-size:13px;color:var(--blue);background:var(--soft);padding:4px 10px;border-radius:4px;white-space:nowrap}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}.question{padding:23px 28px;border-bottom:1px solid var(--line)}.label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}.question p{font-size:18px;font-weight:550;line-height:1.6;margin:0}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);padding:0 28px}.tab{padding:15px 0;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:15px}.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:650}.tab span{font-size:12px;margin-left:6px}.view{padding:25px 28px 28px}.view[hidden]{display:none}.answer{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.9;font-size:16px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0 0;border-top:1px solid var(--line);padding-top:20px}.fact .label{font-weight:400;margin-bottom:3px}.fact strong{font-weight:600;font-size:14px;overflow-wrap:anywhere}.case-note{padding:16px 28px;background:#f8faff;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}.steps{margin:0;padding-left:25px}.steps li{padding:0 0 17px 9px}.steps li:last-child{padding-bottom:0}.source{border:1px solid var(--line);border-radius:5px;padding:17px 18px;margin-bottom:15px}.source:last-child{margin-bottom:0}.source h3{font-size:16px;margin:0 0 5px}.source p{font-size:13px;color:var(--muted);margin:0 0 12px}.source blockquote{margin:0 0 12px;border-left:3px solid #b4c5e4;padding-left:14px;font-size:15px;white-space:pre-wrap}.source a{font-size:14px}.empty{border-left:3px solid #dfa042;background:#fff9ed;padding:16px 20px;font-size:15px}.more{margin-top:20px;padding:17px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}summary{cursor:pointer;font-weight:600;color:var(--ink)}.more p{margin:12px 0 0}.next{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:14px;color:var(--muted);font-size:13px}.next button{background:var(--ink);color:#fff;border:0;border-radius:5px;padding:10px 16px;font-size:14px}.footer{max-width:1240px;margin:22px auto 30px;padding:0 24px;font-size:12px;color:var(--muted)}noscript{display:block;padding:24px;background:#fff5d6}
@media(max-width:800px){header{padding:20px;align-items:flex-start}.status{display:none}.layout{display:block;margin-top:20px;padding:0 18px}.case-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.case-button{padding:12px 9px;gap:5px;grid-template-columns:22px 1fr}.case-title{font-size:14px}.case-kind{font-size:12px}.side-note{display:none}.case-head{margin-top:25px}.case-head h2{font-size:24px}.question,.view{padding:20px}.question p{font-size:17px}.tabs{padding:0 20px;gap:22px}.case-note{padding:16px 20px}.facts{gap:8px}.fact strong{font-size:13px}.footer{padding:0 18px}.next button{white-space:nowrap}}
@media(prefers-reduced-motion:no-preference){.case-button,.tab{transition:background .12s,color .12s}}
</style>
</head>
<body>
<header><div><h1>岗位需求 RAG 分析助手</h1><p>案例回放 · 从问题到证据，再到可复查的结果</p></div><div class="status">本地浏览 · 不调用模型</div></header>
<noscript>请允许本地页面运行 JavaScript，以切换案例和展开证据。也可以直接阅读同目录的 replay.json。</noscript>
<div class="layout">
<aside aria-label="案例选择"><p class="eyebrow">选择一个案例</p><nav class="case-list" id="cases"></nav><p class="side-note"><strong>实际记录，随时回看。</strong><br>选择案例，再查看结果或来源。这里不接收新问题，也不会连接你的数据。</p></aside>
<main id="main">
<div class="case-head"><div><h2 id="title"></h2><p id="subtitle"></p></div><span class="tag" id="category"></span></div>
<section class="panel" aria-labelledby="title">
<div class="question"><span class="label">问题与任务范围</span><p id="question"></p></div>
<div class="tabs" role="tablist" aria-label="案例内容"><button class="tab" id="tab-result" role="tab" aria-controls="view-result" aria-selected="true" data-view="result">处理结果</button><button class="tab" id="tab-evidence" role="tab" aria-controls="view-evidence" aria-selected="false" tabindex="-1" data-view="evidence">证据来源 <span id="evidence-count"></span></button><button class="tab" id="tab-steps" role="tab" aria-controls="view-steps" aria-selected="false" tabindex="-1" data-view="steps">运行过程</button></div>
<div class="view" id="view-result" role="tabpanel" aria-labelledby="tab-result" tabindex="0"><p class="answer" id="answer"></p><div class="facts" id="facts"></div></div>
<div class="view" id="view-evidence" role="tabpanel" aria-labelledby="tab-evidence" tabindex="0" hidden><div id="evidence"></div></div>
<div class="view" id="view-steps" role="tabpanel" aria-labelledby="tab-steps" tabindex="0" hidden><ol class="steps" id="steps"></ol></div>
<div class="case-note" id="note"></div>
</section>
<details class="more"><summary>关于这份演示与完整项目</summary><p id="privacy"></p><p>网页显示保存的结果，不是实时问答。前三例来自本机离线运行；PDF 例来自此前真实模型记录。完整项目支持更多数据与处理方式，启动方法见随附 README。</p><p>来源链接仅在你主动点击时打开外部网站。历史岗位和文档版本不代表当前状态；第三方摘录的权利仍归原作者。</p></details>
<div class="next"><span id="position"></span><button id="next" type="button">下一个案例 →</button></div>
</main></div>
<footer class="footer" id="built"></footer>
<script type="application/json" id="demo-data">__DEMO_PAYLOAD__</script>
<script>
"use strict";
const replay=JSON.parse(document.getElementById("demo-data").textContent);
const byId=id=>document.getElementById(id);
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const tabs=Array.from(document.querySelectorAll("[data-view]"));
let active=0;
function showView(name){for(const tab of tabs){const on=tab.dataset.view===name;tab.setAttribute("aria-selected",String(on));tab.tabIndex=on?0:-1;byId("view-"+tab.dataset.view).hidden=!on;}}
function showCase(index){active=index;const item=replay.cases[index];for(const [i,button]of Array.from(byId("cases").children).entries())button.setAttribute("aria-pressed",String(i===index));for(const field of ["title","subtitle","category","question","note"])byId(field).textContent=item[field];byId("answer").textContent=item.result;byId("facts").replaceChildren(...item.facts.map(f=>{const el=node("div","fact");el.append(node("span","label",f.label),node("strong","",f.value));return el;}));byId("steps").replaceChildren(...item.steps.map(s=>node("li","",s)));byId("evidence-count").textContent=String(item.evidence.length);byId("evidence").replaceChildren(...item.evidence.map(s=>{const el=node("article","source");el.append(node("h3","","["+s.number+"] "+s.title),node("p","",s.label),node("blockquote","",s.text));try{const url=new URL(s.url);if(url.protocol==="https:"&&["talent.baidu.com","documentation.espressif.com"].includes(url.hostname)&&!url.username&&!url.password){const link=node("a","","查看原始来源 ↗");link.href=url.href;link.target="_blank";link.rel="noopener noreferrer";el.append(link);}}catch{}return el;}));if(!item.evidence.length)byId("evidence").append(node("div","empty","本次范围内没有匹配证据，因此没有来源可展开。请注意这不代表其他数据中也不存在相关内容。"));byId("position").textContent=String(index+1).padStart(2,"0")+" / "+String(replay.cases.length).padStart(2,"0");byId("next").textContent=index===replay.cases.length-1?"回到第一个案例 ↺":"下一个案例 →";showView("result");}
replay.cases.forEach((item,index)=>{const button=node("button","case-button");button.type="button";button.setAttribute("aria-pressed","false");const label=node("span","case-title",item.title);label.append(node("span","case-kind",item.category));button.append(node("span","case-number",String(index+1).padStart(2,"0")),label);button.addEventListener("click",()=>showCase(index));byId("cases").append(button);});
tabs.forEach((tab,index)=>{tab.addEventListener("click",()=>showView(tab.dataset.view));tab.addEventListener("keydown",event=>{let next;if(event.key==="ArrowRight")next=(index+1)%tabs.length;else if(event.key==="ArrowLeft")next=(index+tabs.length-1)%tabs.length;else if(event.key==="Home")next=0;else if(event.key==="End")next=tabs.length-1;else return;event.preventDefault();tabs[next].focus();showView(tabs[next].dataset.view);});});
byId("next").addEventListener("click",()=>showCase((active+1)%replay.cases.length));byId("privacy").textContent=replay.privacy;byId("built").textContent="演示整理于 "+replay.built_at.slice(0,10)+" · 数据与结果范围见各案例说明";showCase(0);
</script>
</body></html>
