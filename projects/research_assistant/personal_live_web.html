<!doctype html>
<html lang="zh-CN" data-app="personal-live-rag-ui">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岗位需求 RAG 分析助手</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #697386;
      --line: #dfe4ec;
      --paper: #ffffff;
      --wash: #f4f7fb;
      --blue: #2856d8;
      --blue-dark: #193b9d;
      --green: #138a62;
      --amber: #b76608;
      --shadow: 0 18px 50px rgba(25, 45, 85, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(88, 126, 255, 0.13), transparent 30rem),
        radial-gradient(circle at 92% 18%, rgba(34, 180, 137, 0.10), transparent 25rem),
        var(--wash);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    .hero { display: flex; justify-content: space-between; gap: 28px; align-items: flex-start; margin-bottom: 24px; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 48px); line-height: 1.05; letter-spacing: -0.04em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 720px; }
    .status { white-space: nowrap; padding: 9px 13px; border-radius: 999px; background: #e7f7f1; color: var(--green); font-size: 13px; font-weight: 700; }
    .status.loading { background: #fff2df; color: var(--amber); }
    .status.error { background: #fee9e8; color: #b42318; }

    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
    .badge { padding: 7px 10px; border: 1px solid var(--line); background: rgba(255,255,255,.72); border-radius: 9px; color: #465066; font-size: 12px; font-weight: 700; }

    .card { background: rgba(255,255,255,.94); border: 1px solid rgba(216,223,234,.9); border-radius: 20px; box-shadow: var(--shadow); }
    .composer { padding: 22px; }
    label { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 800; }
    textarea { width: 100%; min-height: 126px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; font: inherit; color: var(--ink); background: #fbfcfe; outline: none; transition: border .18s, box-shadow .18s; }
    textarea:focus { border-color: #7794ee; box-shadow: 0 0 0 4px rgba(40,86,216,.10); }
    .row { display: grid; grid-template-columns: 1fr 140px auto; gap: 12px; align-items: end; margin-top: 14px; }
    select { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 11px; padding: 0 12px; background: white; color: var(--ink); }
    button { height: 44px; border: 0; border-radius: 11px; padding: 0 20px; background: var(--blue); color: white; font-weight: 800; cursor: pointer; transition: transform .15s, background .15s; }
    button:hover { background: var(--blue-dark); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .65; transform: none; }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .examples { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 2px; }
    .example { flex: 0 0 auto; height: auto; max-width: 320px; padding: 9px 12px; border: 1px solid var(--line); background: white; color: #41506d; font-size: 12px; text-align: left; }

    .result { margin-top: 20px; padding: 24px; }
    .result[hidden] { display: none; }
    .result-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .result h2 { margin: 0; font-size: 19px; }
    .meta { color: var(--muted); font-size: 12px; text-align: right; }
    .answer { white-space: pre-wrap; line-height: 1.8; font-size: 15px; overflow-wrap: anywhere; }
    .citations { display: grid; gap: 9px; margin-top: 20px; }
    .citation { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #f8faff; }
    .citation a { color: var(--blue); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
    .citation-source { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .error-box { color: #b42318; background: #fff1f0; border: 1px solid #ffc9c5; border-radius: 12px; padding: 13px 14px; }
    .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid rgba(255,255,255,.45); border-top-color: white; border-radius: 50%; vertical-align: -2px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .shell { width: min(100% - 20px, 1080px); padding-top: 24px; }
      .hero { display: block; }
      .status { display: inline-block; margin-top: 16px; }
      .row { grid-template-columns: 1fr 110px; }
      .row button { grid-column: 1 / -1; }
      .result-head { display: block; }
      .meta { text-align: left; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <h1>岗位需求 RAG 分析助手</h1>
        <p class="subtitle">从本地岗位证据中检索、重排，再由真实大模型生成带来源的回答。回答仅反映当前保存的岗位样本，不代表职位仍开放。</p>
        <div class="badges">
          <span class="badge">BM25 + BGE</span>
          <span class="badge">RRF Hybrid</span>
          <span class="badge">Cross-Encoder ReRank</span>
          <span class="badge">真实 DeepSeek</span>
        </div>
      </div>
      <div id="serviceStatus" class="status loading">正在连接本地服务</div>
    </section>

    <section class="card composer">
      <form id="askForm">
        <label for="question">你想了解哪些岗位要求？</label>
        <textarea id="question" maxlength="500" placeholder="例如：哪些深圳岗位明确提到 LangGraph？请给出岗位和证据。" required></textarea>
        <div class="row">
          <div>
            <label for="city">城市筛选</label>
            <select id="city">
              <option value="">不限城市</option>
              <option value="深圳">深圳</option>
              <option value="上海">上海</option>
              <option value="广州">广州</option>
            </select>
          </div>
          <div>
            <label for="topK">证据数量</label>
            <select id="topK">
              <option value="3" selected>3 条</option>
              <option value="4">4 条</option>
              <option value="5">5 条</option>
            </select>
          </div>
          <button id="submitButton" type="submit">开始分析</button>
        </div>
        <p class="hint">首次提问需要加载本地模型，可能等待几十秒。普通证据问答会调用真实模型并可能产生费用；失败不自动重试。</p>
      </form>
      <div class="examples" aria-label="示例问题">
        <button class="example" type="button" data-question="哪些深圳岗位明确提到 LangGraph？请给出岗位和证据。">深圳 + LangGraph</button>
        <button class="example" type="button" data-question="找出同时要求 RAG、Python 和部署能力的岗位，并比较要求。">RAG + Python + 部署</button>
        <button class="example" type="button" data-question="哪些岗位更适合有 PyTorch 和 Agent 项目经验的候选人？只依据证据回答。">PyTorch + Agent 匹配</button>
      </div>
    </section>

    <section id="result" class="card result" hidden aria-live="polite">
      <div class="result-head">
        <h2 id="resultTitle">分析结果</h2>
        <div id="resultMeta" class="meta"></div>
      </div>
      <div id="answer" class="answer"></div>
      <div id="citations" class="citations"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('askForm');
    const questionInput = document.getElementById('question');
    const cityInput = document.getElementById('city');
    const topKInput = document.getElementById('topK');
    const submitButton = document.getElementById('submitButton');
    const serviceStatus = document.getElementById('serviceStatus');
    const result = document.getElementById('result');
    const answer = document.getElementById('answer');
    const citations = document.getElementById('citations');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');

    function setStatus(text, kind = '') {
      serviceStatus.textContent = text;
      serviceStatus.className = `status ${kind}`.trim();
    }

    async function refreshHealth() {
      try {
        const response = await fetch('/health');
        if (!response.ok) throw new Error('health failed');
        const health = await response.json();
        setStatus(health.service_loaded ? '服务已就绪' : '服务已启动 · 检索链路待加载');
      } catch (_) {
        setStatus('本地服务未连接', 'error');
      }
    }

    function safeSourceLink(url) {
      try {
        const parsed = new URL(url);
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : null;
      } catch (_) {
        return null;
      }
    }

    function renderPayload(payload) {
      result.hidden = false;
      resultTitle.textContent = payload.refused ? '安全拒答' : '分析结果';
      answer.className = 'answer';
      answer.textContent = payload.answer;
      citations.replaceChildren();
      for (const item of payload.citations || []) {
        const box = document.createElement('div');
        box.className = 'citation';
        const link = safeSourceLink(item.source_url);
        if (link) {
          const anchor = document.createElement('a');
          anchor.href = link;
          anchor.target = '_blank';
          anchor.rel = 'noreferrer';
          anchor.textContent = `[${item.number}] 打开岗位来源`;
          box.append(anchor);
        } else {
          const label = document.createElement('strong');
          label.textContent = `[${item.number}] 岗位来源`;
          box.append(label);
        }
        const source = document.createElement('div');
        source.className = 'citation-source';
        source.textContent = item.source;
        box.append(source);
        citations.append(box);
      }
      const usage = payload.model_usage ? ` · tokens ${JSON.stringify(payload.model_usage)}` : '';
      resultMeta.textContent = `${payload.answer_mode} · ${payload.latency_ms.toFixed(0)} ms${usage}`;
      result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderError(message) {
      result.hidden = false;
      resultTitle.textContent = '请求失败';
      resultMeta.textContent = '';
      citations.replaceChildren();
      answer.className = 'error-box';
      answer.textContent = message;
    }

    function setBusy(busy) {
      submitButton.disabled = busy;
      submitButton.innerHTML = busy ? '<span class="spinner"></span>正在分析' : '开始分析';
      if (busy) setStatus('正在分析岗位证据', 'loading');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;
      setBusy(true);
      result.hidden = true;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 125000);
      const body = { question, top_k: Number(topKInput.value) };
      if (cityInput.value) body.city = cityInput.value;
      try {
        const response = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal,
        });
        const payload = await response.json();
        if (!response.ok) {
          const detail = payload.detail;
          const message = detail && typeof detail === 'object'
            ? detail.message || JSON.stringify(detail)
            : detail || `HTTP ${response.status}`;
          throw new Error(message);
        }
        renderPayload(payload);
        setStatus('服务已就绪');
      } catch (error) {
        const message = error.name === 'AbortError'
          ? '请求超过 125 秒。服务仍可能在后台完成本次同步调用，请先等待，不要立即重复提交。'
          : String(error.message || error);
        renderError(message);
        setStatus('本次请求失败', 'error');
      } finally {
        clearTimeout(timer);
        setBusy(false);
      }
    });

    for (const button of document.querySelectorAll('[data-question]')) {
      button.addEventListener('click', () => {
        questionInput.value = button.dataset.question;
        questionInput.focus();
      });
    }

    questionInput.addEventListener('keydown', (event) => {
      if (event.ctrlKey && event.key === 'Enter') form.requestSubmit();
    });

    refreshHealth();
  </script>
</body>
</html>
